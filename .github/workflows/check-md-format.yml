name: Check Markdown Format

on:
  pull_request:
    paths:
      - 'comfyui_embedded_docs/docs/**/*.md'
      - '.github/scripts/check_md_format.py'
      - '.github/workflows/check-md-format.yml'
  schedule:
    # Weekly full-repo scan (catches defects already on main)
    - cron: '0 21 * * 5'

jobs:
  check-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch base for changed-files scope
        if: github.event_name == 'pull_request'
        run: git fetch origin main
      - name: Run markdown format checks - PR changed files only
        if: github.event_name == 'pull_request'
        run: |
          python .github/scripts/check_md_format.py --changed-only --base origin/main
      - name: Run markdown format checks - scheduled full repo
        if: github.event_name == 'schedule'
        run: |
          python .github/scripts/check_md_format.py || echo "::warning::Pre-existing format defects found on main - open a cleanup PR"
